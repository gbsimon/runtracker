services:
  postgres:
    image: postgres:18-alpine
    container_name: runtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: runtracker
      POSTGRES_PASSWORD: runtracker
      POSTGRES_DB: runtracker
    # Host port 5433: 5432 is commonly taken by another local Postgres.
    ports:
      - "5433:5432"
    volumes:
      - runtracker-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtracker -d runtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  runtracker-pgdata:
